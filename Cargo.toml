[package]
name = "mcman"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha1 = "0.10"
reqwest = { version = "0.12", features = ["blocking", "json"] }
urlencoding = "2"
flate2 = "1"
tauri = { version = "2", features = [] }
url = "2"
include_dir = "0.7.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
strip = true
