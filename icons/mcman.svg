<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b33"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ecf6a"/>
      <stop offset="1" stop-color="#4ea03d"/>
    </linearGradient>
    <linearGradient id="dirtL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a4e"/>
      <stop offset="1" stop-color="#6b4f38"/>
    </linearGradient>
    <linearGradient id="dirtR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5138"/>
      <stop offset="1" stop-color="#523c29"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59c26f"/>
      <stop offset="1" stop-color="#2f9e57"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="215" fill="url(#bg)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="211" fill="none" stroke="#3a4250" stroke-width="3" opacity="0.6"/>

  <!-- isometric voxel cube: top face = grass, sides = dirt/stone -->
  <!-- cube center ~ (470,470), half-width 250, side-height 230 -->
  <polygon points="470,180 720,305 720,535 470,660" fill="url(#dirtR)"/>
  <polygon points="220,305 470,180 470,660 220,535" fill="url(#dirtL)"/>
  <polygon points="470,60 720,305 470,535 220,305" fill="url(#grass)"/>
  <!-- pixel texture hints on grass top -->
  <polygon points="470,140 580,250 470,360 360,250" fill="#8fd97c" opacity="0.35"/>
  <!-- strata lines on dirt faces -->
  <polygon points="220,430 470,555 470,585 220,460" fill="#5c4330" opacity="0.55"/>
  <polygon points="720,430 470,555 470,585 720,460" fill="#46331f" opacity="0.55"/>
  <polygon points="220,345 470,470 470,492 220,367" fill="#a17c5c" opacity="0.25"/>
  <polygon points="720,345 470,470 470,492 720,367" fill="#7c5c40" opacity="0.22"/>

  <!-- update badge: green circle with bold up-arrow, overlapping bottom-right -->
  <circle cx="716" cy="676" r="168" fill="#0e1013" opacity="0.5"/>
  <circle cx="712" cy="668" r="164" fill="#171a1f"/>
  <circle cx="712" cy="668" r="152" fill="url(#badge)"/>
  <path d="M712 560 L812 684 L760 684 L760 764 L664 764 L664 684 L612 684 Z" fill="#ffffff"/>
</svg>
